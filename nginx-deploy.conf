# nginx 生产部署配置
# 用法：替换 E:\ZHLXT\nginx-1.26.2\nginx-1.26.2\conf\nginx.conf

#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8086;
        server_name  192.168.110.64;

        # 首页跳转到前端 /CS/
        location = / {
            return 301 /CS/;
        }

        # 前端静态资源（Vite 打包到 html/CS）
        location / {
            root   html;
            index  index.html index.htm;
            try_files $uri $uri/ /CS/index.html;
        }

        # 后端生成的 PNG / GeoJSON 静态输出
        # 例：/ng/avaflow_beta/xxx -> html/avaflow_beta/xxx
        location /ng/ {
            alias  html/;
        }

        # Spring Boot 后端（Tomcat 8080）
        location /testapi/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # GeoServer
        location /geoserver/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Node 后端
        location /node/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 设备服务
        location /device/ {
            proxy_pass http://127.0.0.1:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 原有 /RI 目录
        location /RI {
            alias E:/RI_test/;
            allow all;
            autoindex on;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, token';
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, token';
                return 204;
            }
        }
    }
}